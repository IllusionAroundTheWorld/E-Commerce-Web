<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" >
    <title>Cargo - Login</title>
    <link rel="stylesheet" type="text/css" href="./Style/Login.css">
</head>

<body>
    <main class="login-page">
        <section class="login-container">

            <!-- Logo -->
            <div class="logo">
                <a href="./index.html">Cargo</a>
            </div>
            <h1>Login</h1>

            <p class="subtitle">
                Login to your Cargo account
            </p>


            <!-- User Type -->
            <div class="user-type">

                <p class="label">
                    Login as
                </p>

                <div class="role-container">
                    <button type="button" class="role active" data-role="customer" > Customer </button>
                    <button type="button" class="role" data-role="vendor" > Vendor </button>
                    <button type="button" class="role" data-role="admin" > Admin </button>
                </div>
            </div>


            <!-- Login Form -->
            <form id="loginForm">
                <input type="hidden" id="role" value="customer" >

                <!-- Email -->
                <div class="input-group">
                    <label for="email"> Email </label>
                    <input type="email" id="email" placeholder="Enter your email" required >

                </div>

                <!-- Password -->
                <div class="input-group">
                    <label for="password">
                        Password
                    </label>

                    <div class="password-box">
                        <input type="password" id="password" placeholder="Enter your password" required >
                        <button type="button" id="showPassword" > Show </button>
                    </div>

                </div>


                <!-- Options -->
                <div class="options">
                    <label>
                        <input type="checkbox" id="remember" />
                        Remember me
                    </label>

                    <a href="#"> Forgot Password? </a>

                </div>


                <!-- Login -->
                <button type="submit" class="login-button">
                    Login
                </button>

                <!-- Message -->
                <p id="message"></p>
            </form>


            <!-- Customer Registration -->
            <div class="register" id="customerRegister" >
                <p>
                    Don't have an account?
                    <a href="#">
                        Create Customer Account
                    </a>
                </p>
            </div>

            <!-- Vendor Registration -->
            <div class="register hidden" id="vendorRegister" >
                <p>
                    Want to sell on Cargo?
                    <a href="#">
                        Register as Vendor
                    </a>
                </p>
            </div>


            <!-- Admin Message -->
            <div class="register hidden" id="adminRegister" >
                <p>
                    Admin accounts are created by
                    the Cargo administrator.
                </p>
            </div>
        </section>
    </main>
    <script src="../Script/Login.js"></script>
</body>
</html>
