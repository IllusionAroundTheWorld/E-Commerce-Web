<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cart - Cargo</title>
<link rel="stylesheet" href="../Templates/Style/Cart.css">

</head>
<body>

<header class="navbar">
    <h1><a href="#">Cargo</a></h1>
    <nav>
        <a href="../index.html">Home</a>
        <a href="#">Products</a>
        <a href="./cart.html">Cart 🛒</a>
    </nav>
</header>

<main class="cart-container">
    <h2>Shopping Cart</h2>
    <section id="cart-items">
        <!-- Product 1 -->
        <div class="cart-item">
            <img
                src="https://via.placeholder.com/120"
                alt="Product">
            <div class="product-info">
                <h3>Wireless Headphones</h3>
                <p>₹1,999</p>
            </div>
            <div class="quantity">
                <button onclick="decreaseQuantity(0)">−</button>
                <span id="quantity-0">1</span>
                <button onclick="increaseQuantity(0)">+</button>
            </div>
            <div class="item-total">
                ₹<span id="total-0">1999</span>
            </div>
            <button
                class="remove"
                onclick="removeItem(0)">
                Remove
            </button>
        </div>

        <!-- Product 2 -->
        <div class="cart-item">
            <img
                src="https://via.placeholder.com/120"
                alt="Product">
            <div class="product-info">
                <h3>Wireless Mouse</h3>
                <p>₹799</p>
            </div>
            <div class="quantity">
                <button onclick="decreaseQuantity(1)">−</button>
                <span id="quantity-1">1</span>
                <button onclick="increaseQuantity(1)">+</button>
            </div>
            <div class="item-total">
                ₹<span id="total-1">799</span>
            </div>
            <button
                class="remove"
                onclick="removeItem(1)">
                Remove
            </button>
        </div>
    </section>

    <!-- Cart Summary -->
    <section class="cart-summary">
        <h2>Order Summary</h2>
        <div class="summary-row">
            <span>Subtotal</span>
            <span>₹<span id="subtotal">2798</span></span>
        </div>
        <div class="summary-row">
            <span>Shipping</span>
            <span>₹<span id="shipping">50</span></span>
        </div>
        <hr>
        <div class="summary-row total">
            <span>Total</span>
            <span>₹<span id="grand-total">2848</span></span>
        </div>
        <button
            class="checkout"
            onclick="checkout()">
            Proceed to Checkout
        </button>
    </section>
</main>
<script src="./js/cart.js"></script>
</body>
</html>
